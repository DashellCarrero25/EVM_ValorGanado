<div class="actividad-form-title-bar">
	<span class="actividad-form-title">Registrar actividad</span>
</div>
<form [formGroup]="actividadForm" (ngSubmit)="submit()" class="actividad-form" [ngClass]="{highlight: highlight}">
	<div *ngIf="error" class="error">{{ error }}</div>
	<div class="form-row">
		<mat-form-field appearance="outline">
			<mat-label>Proyecto</mat-label>
			<mat-select formControlName="proyecto_id" required>
				<mat-option *ngFor="let proyecto of proyectos" [value]="proyecto.id">{{ proyecto.nombre }}</mat-option>
			</mat-select>
		</mat-form-field>
		<mat-form-field appearance="outline">
			<mat-label>Nombre Actividad</mat-label>
			<input matInput type="text" formControlName="nombre" required />
		</mat-form-field>
	</div>
	<div class="form-row">
		<mat-form-field appearance="outline">
			<mat-label>BAC</mat-label>
			<input matInput type="number" formControlName="bac" required min="0" />
		</mat-form-field>
		<mat-form-field appearance="outline">
			<mat-label>Avance planificado (%)</mat-label>
			<input matInput type="number" formControlName="avance_planificado" required min="0" max="100" />
		</mat-form-field>
		<mat-form-field appearance="outline">
			<mat-label>Avance real (%)</mat-label>
			<input matInput type="number" formControlName="avance_real" required min="0" max="100" />
		</mat-form-field>
		<mat-form-field appearance="outline">
			<mat-label>AC</mat-label>
			<input matInput type="number" formControlName="ac" required min="0" />
		</mat-form-field>
	</div>
	<div class="form-row">
		<mat-form-field appearance="outline">
			<mat-label>Fecha inicio</mat-label>
			<input matInput type="date" formControlName="fecha_inicio" />
		</mat-form-field>
		<mat-form-field appearance="outline">
			<mat-label>Fecha fin</mat-label>
			<input matInput type="date" formControlName="fecha_fin" />
		</mat-form-field>
	</div>
	<div class="form-actions">
		<button mat-raised-button color="primary" type="submit" [disabled]="loading">
			<mat-progress-spinner *ngIf="loading" mode="indeterminate" diameter="20"></mat-progress-spinner>
			<span *ngIf="!loading">{{ actividadEditar ? 'Actualizar actividad' : 'Crear actividad' }}</span>
		</button>
		<button mat-stroked-button type="button" (click)="limpiar()">Limpiar</button>
	</div>
</form>
