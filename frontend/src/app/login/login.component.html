<form [formGroup]="loginForm" (ngSubmit)="submit()" class="login-form" aria-label="Formulario de inicio de sesión">
	<h2>Iniciar sesión</h2>
	<div class="form-group">
		<label for="email">Correo electrónico</label>
		<input id="email" type="email" formControlName="email" autocomplete="username" required [attr.aria-invalid]="correo?.invalid && (correo?.touched || correo?.dirty)" />
		<div class="error" *ngIf="correo?.invalid && (correo?.touched || correo?.dirty)">
			<span *ngIf="correo?.errors?.['required']">El correo es obligatorio.</span>
			<span *ngIf="correo?.errors?.['email']">Formato de correo inválido.</span>
		</div>
	</div>
	<div class="form-group">
		<label for="password">Contraseña</label>
		<input id="password" type="password" formControlName="password" autocomplete="current-password" required minlength="8" [attr.aria-invalid]="password?.invalid && (password?.touched || password?.dirty)" />
		<div class="error" *ngIf="password?.invalid && (password?.touched || password?.dirty)">
			<span *ngIf="password?.errors?.['required']">La contraseña es obligatoria.</span>
			<span *ngIf="password?.errors?.['minlength']">Mínimo 8 caracteres.</span>
		</div>
	</div>
	<button type="submit" [disabled]="loading">Entrar</button>
	<div class="error" *ngIf="error">{{ error }}</div>
</form>
